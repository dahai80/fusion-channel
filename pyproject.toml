[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-channel"
version = "0.1.2"
description = "Fusion-Channel — unified messaging channel access layer for the Fusion ecosystem (webhook verification, outbox, dedup, cards, identity mapping)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: real provider connectivity tests (run with -m integration; requires sandbox credentials)",
]

[tool.coverage.run]
source = ["fusion_channel"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_channel"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusion_channel*"]
